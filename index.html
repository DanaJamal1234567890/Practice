<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Website</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      margin-top: 50px;
      background-color: #f9f9f9; 
    }
    #logo {
      width: 150px;      
      margin-bottom: 30px; 
    }
    .submit-btn {
      background-color: #4CAF50; 
      color: white;              
      padding: 12px 25px;       
      border: none;              
      border-radius: 5px;       
      cursor: pointer;        
      font-size: 16px;       
      transition: background-color 0.3s;
    }

    .submit-btn:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <img src="Logo.png" alt="DM6032 Logo" id="logo">
  
  <form action="your-action-page.html" method="post">
    <input type="submit" value="Submit" class="submit-btn">
  </form>
</body>
</html>
